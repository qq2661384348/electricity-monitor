# =============================================================================
# 电力监控系统 - 本地 Docker 调试 Compose
# =============================================================================
#
# 推荐通过 ./deploy/build.sh 调用，而不是直接在根目录执行 docker compose。
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 服务（本地调试数据持久化到 named volume）
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: electricity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-docker-postgres-password
      POSTGRES_DB: electricity_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electricity_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 服务（纯内存模式，无持久化）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: electricity-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 应用服务
  # ---------------------------------------------------------------------------
  app:
    image: electricity-monitor:latest
    container_name: electricity-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # development 环境只允许local environment数据库 / Redis 地址。app 使用 host network，
    # 再访问本 compose 暴露到 127.0.0.1 的 PostgreSQL / Redis 端口，避免
    # 容器内的 127.0.0.1 被误解成 app 容器自身。
    network_mode: host
    environment:
      # 本地 Docker 调试使用 development 环境约束
      - APP_ENV=development
      - APP__SERVER__HOST=0.0.0.0
      - APP__SERVER__PORT=11450
      # PostgreSQL / Redis 通过 host network 访问本 compose 映射出的local environment端口
      - APP__DATABASE__HOST=127.0.0.1
      - APP__DATABASE__PORT=15432
      - APP__DATABASE__USERNAME=postgres
      - APP__DATABASE__PASSWORD=local-docker-postgres-password
      - APP__DATABASE__DATABASE=electricity_dev
      - APP__REDIS__HOST=127.0.0.1
      - APP__REDIS__PORT=16379
      # 这些默认值只用于让本地容器完成启动；真实发送能力仍取决于local environment NapCat。
      - APP__QQ_BOT__API_URL=http://127.0.0.1:3000/send_private_msg
      - APP__QQ_BOT__PUBLIC_QQ_NUMBER=100000001
      - APP__QQ_BOT__BEARER_TOKEN=local-dev-qq-bot-token
      - APP__PUBLIC_SITE__DOMAIN=127.0.0.1
      - APP__PUBLIC_SITE__PORT=11450
      - APP__ADMIN__DEFAULT_QQ_NUMBER=100000001
      # 日志级别（可选：trace/debug/info/warn/error）
      # - APP__LOGGING__LEVEL=info
      # - APP__JWT__SECRET=your-jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11450/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

# -----------------------------------------------------------------------------
# 网络配置
# -----------------------------------------------------------------------------
networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
