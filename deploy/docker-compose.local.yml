# =============================================================================
# 电力监控系统 - 本地 Docker 调试 Compose
# =============================================================================
#
# 推荐通过 ./deploy/build.sh 调用，而不是直接在根目录执行 docker compose。
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis 服务（纯内存模式，无持久化）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: electricity-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 应用服务
  # ---------------------------------------------------------------------------
  app:
    image: electricity-monitor:latest
    container_name: electricity-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "11450:8000"
    environment:
      # 生产环境标识
      - APP_ENV=production
      # Redis 地址（连接到 compose 内部的 redis 服务）
      - APP__REDIS__HOST=redis
      - APP__REDIS__PORT=6379
      # 日志级别（可选：trace/debug/info/warn/error）
      # - APP__LOGGING__LEVEL=info
      # 以下为可选覆盖项，取消注释并填写实际值
      # - APP__DATABASE__HOST=your-db-host
      # - APP__DATABASE__PASSWORD=your-password
      # - APP__JWT__SECRET=your-jwt-secret
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

# -----------------------------------------------------------------------------
# 网络配置
# -----------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
