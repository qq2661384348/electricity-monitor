change: add-email-module
scope:
  - backend email infrastructure
  - runtime config templates
  - release secret wiring
dependencies:
  services:
    - none for automated tests
  external:
    - smtp.qq.com only for optional manual smoke
fixtures:
  - eval/fixtures/email-config-sample.toml
commands:
