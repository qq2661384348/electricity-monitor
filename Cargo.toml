[package]
name = "electricity-monitor-backend"
version = "0.1.0"
edition = "2021"
authors = ["Electricity Monitor Team"]
description = "高性能电力监控系统后端API - Rust实现"

[dependencies]
# Web框架 - Axum 0.8.x (最新稳定版)
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.45", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }

# 数据库 - Diesel + diesel-async
# 注意：开发环境仅启用postgres，需要mysql时取消注释mysql feature
diesel = { version = "2.3", features = ["postgres", "chrono", "uuid"] }
diesel-async = { version = "0.7", features = ["postgres", "deadpool", "async-connection-wrapper"] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }
diesel_migrations = "2.3"
futures-util = "0.3"

# 序列化 - sonic-rs (SIMD加速) + serde
sonic-rs = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 配置管理
config = "0.15.18"

# 认证 & 安全
# jsonwebtoken 10.x 需要选择加密后端：rust_crypto (纯Rust实现) 或 aws_lc_rs (需要NASM/CMake)
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
bcrypt = "0.17"

# 数据验证
validator = { version = "0.20", features = ["derive"] }

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# 日志
tracing = "0.1"  # 最新稳定版 0.1.x 系列
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }  # 2025年最新版

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 内存分配器 - mimalloc (高性能内存分配器)
mimalloc = "0.1"

[dev-dependencies]
# 测试工具
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "server"
path = "src/main.rs"
