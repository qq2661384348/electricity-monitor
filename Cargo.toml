[package]
name = "electricity-monitor-backend"
version = "0.1.0"
edition = "2021"
authors = ["Electricity Monitor Team"]
description = "高性能电力监控系统后端API - Rust实现"
default-run = "server"

[dependencies]
# Web框架 - Axum 0.8.x (最新稳定版)
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.45", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full", "fs", "set-header"] }

# 数据库 - Diesel + diesel-async
# 注意：开发环境仅启用postgres，需要mysql时取消注释mysql feature
diesel = { version = "2.3", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.7", features = ["postgres", "deadpool", "async-connection-wrapper"] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }
diesel_migrations = "2.3"
futures-util = "0.3"

# =============================================================================
# 跨平台静态链接支持 (Windows → Linux Docker 兼容)
# =============================================================================
# 通过 feature 控制是否使用静态链接：
# - 默认（Windows 开发）: 使用系统安装的库
# - Docker 构建: cargo build --features static-build
# 参考: https://www.edu4rdshl.dev/posts/rust-binaries-with-diesel-and-postgres-static-linking-on-2025/

# 基础依赖（不带 bundled/vendored）
pq-sys = "0.7"
openssl-sys = "0.9"

# Redis - 缓存与限流
# 注意：deadpool-redis 0.22 使用 redis 0.32，版本需要匹配
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.22.0"

# 序列化 - sonic-rs (SIMD加速) + serde
sonic-rs = "0.5.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP客户端 - reqwest (用于爬虫模块)
reqwest = { version = "0.12", features = ["json"] }

# URL编码
urlencoding = "2.1"

# LRU缓存
lru = "0.16.3"

# 配置管理
config = "0.15.19"

# 认证 & 安全
# jsonwebtoken 10 需要显式选择一个加密后端。仓库当前只使用 HMAC，
# 因此通过自定义 provider 只接入 HMAC 所需算法，避免重新引入 RSA 依赖链。
jsonwebtoken = { version = "10.3", default-features = false }
hmac = "0.12.1"
sha2 = { version = "0.10.9", features = ["oid"] }
bcrypt = "0.17"

# 数据验证
validator = { version = "0.20", features = ["derive"] }

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# 日志
tracing = "0.1"  # 最新稳定版 0.1.x 系列
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }  # 2025年最新版

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 内存分配器 - mimalloc (高性能内存分配器)
mimalloc = "0.1"

rand = "0.9"
once_cell = "1.21.3"
regex = "1.12.2"
futures = "0.3.31"
moka = { version = "0.12.11", features = ["future"] }
dashmap = "6.1.0"
async-trait = "0.1.89"

[dev-dependencies]
# 测试工具
tokio-test = "0.4"

# =============================================================================
# Feature 定义
# =============================================================================
[features]
default = []

# 静态链接模式（Docker/Linux 构建使用）
# 用法: cargo build --release --features static-build
static-build = ["pq-sys/bundled", "openssl-sys/vendored"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[test]]
name = "auth_integration_test"
path = "tests/contracts/auth_integration_test.rs"

[[test]]
name = "release_readiness_test"
path = "tests/runtime/release_readiness_test.rs"

[[test]]
name = "send_verification_code_integration_test"
path = "tests/contracts/send_verification_code_integration_test.rs"
