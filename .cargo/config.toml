# ============================================================
# Cargo 编译配置 - 电力监控系统
# ============================================================
# 
# 说明：
# 1. PostgreSQL 16+ 自带 OpenSSL，无需单独安装
# 2. 环境变量配置会自动应用于编译过程
# 3. Docker 构建使用 --features static-build 启用静态链接
#
# ============================================================

# 环境变量配置 - 统一入口
[env]
# PostgreSQL 安装目录（包含 lib、include 等子目录）
# build.rs 会自动检测，通常无需手动设置
# POSTGRES_HOME = "C:\\Program Files\\PostgreSQL\\16"

# OpenSSL 配置 - 使用 PostgreSQL 自带的 OpenSSL
# PostgreSQL 16+ 包含完整的 OpenSSL 开发文件
OPENSSL_DIR = "C:\\Program Files\\PostgreSQL\\16"
OPENSSL_LIB_DIR = "C:\\Program Files\\PostgreSQL\\16\\lib"
OPENSSL_INCLUDE_DIR = "C:\\Program Files\\PostgreSQL\\16\\include"

# PostgreSQL 库路径
PQ_LIB_DIR = "C:\\Program Files\\PostgreSQL\\16\\lib"

# ============================================================
# 编译优化配置
# ============================================================

[build]
# 启用 SIMD 优化（sonic-rs 需要）
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
# Windows MSVC 工具链优化
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
# Linux GNU 工具链优化
rustflags = ["-C", "target-cpu=native"]
