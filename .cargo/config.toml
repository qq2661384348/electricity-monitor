# ============================================================
# Cargo 编译配置 - 电力监控系统
# ============================================================
# 
# 说明：
# 1. 仓库级配置只保留跨平台稳定项，不保存任何宿主机私有库路径
# 2. Windows 原生开发如需指定 PostgreSQL / OpenSSL 路径，应使用用户环境变量
# 3. Linux 开发通过系统包提供 libpq / OpenSSL 头文件和库
# 4. Docker 构建使用 --features static-build 启用静态链接
#
# ============================================================

# 环境变量配置
#
# 不在仓库级配置中写入 PQ_LIB_DIR / OPENSSL_DIR / OPENSSL_LIB_DIR /
# OPENSSL_INCLUDE_DIR 这类宿主机路径。它们会被 Cargo 无条件注入到所有
# 平台；如果这里写入 Windows 路径，Linux 构建会尝试读取 C:\... 并失败。
#
# Windows 原生开发如果 PostgreSQL 或 OpenSSL 不在标准路径，请在用户环境变量
# 或当前 shell 中设置 POSTGRES_HOME、PQ_LIB_DIR、OPENSSL_DIR 等本地私有值。
#
# Linux 开发应通过系统包提供 libpq/openssl，例如：
#   apt-get install -y libpq-dev libssl-dev pkg-config postgresql-client redis-tools
[env]

# ============================================================
# 编译优化配置
# ============================================================

[build]
# 启用 SIMD 优化（sonic-rs 需要）
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
# Windows MSVC 工具链优化
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
# Linux GNU 工具链优化
rustflags = ["-C", "target-cpu=native"]
