name: Package Docker Release

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: Git tag to build and package
        required: true
        type: string

env:
  IMAGE_NAME: electricity-monitor
  REDIS_IMAGE: redis:8-alpine
  RELEASE_ROOT: release

jobs:
  package-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and checkout git tag
        shell: bash
        env:
          GIT_TAG: ${{ inputs.git_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          if ! git rev-parse "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag not found: ${GIT_TAG}"
            exit 1
          fi

          git checkout "refs/tags/${GIT_TAG}"

          if [[ ! "${GIT_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git tag '${GIT_TAG}' is not a valid Docker tag. Use characters [A-Za-z0-9_.-] and avoid '/'."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build frontend and copy static assets
        working-directory: frontend
        shell: bash
        run: bun run build:prod

      - name: Prepare production runtime config
        shell: bash
        run: cp config/production.toml.example config/default.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.git_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=electricity-monitor-release
          cache-to: type=gha,mode=max,scope=electricity-monitor-release

      - name: Pull Redis image
        shell: bash
        run: docker pull "${REDIS_IMAGE}"

      - name: Assemble release package
        shell: bash
        env:
          GIT_TAG: ${{ inputs.git_tag }}
        run: |
          set -euo pipefail

          app_archive="${IMAGE_NAME}-${GIT_TAG}-linux-amd64.tar"
          redis_archive="redis-8-alpine-linux-amd64.tar"
          package_name="release-${GIT_TAG}.tar.gz"
          git_sha="$(git rev-parse HEAD)"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          rm -rf "${RELEASE_ROOT}"
          mkdir -p "${RELEASE_ROOT}/images" "${RELEASE_ROOT}/secrets"

          docker save "${IMAGE_NAME}:${GIT_TAG}" | gzip > "${RELEASE_ROOT}/images/${app_archive}.gz"
          docker save "${REDIS_IMAGE}" | gzip > "${RELEASE_ROOT}/images/${redis_archive}.gz"

          app_image_digest="$(docker image inspect "${IMAGE_NAME}:${GIT_TAG}" --format '{{.Id}}')"
          redis_image_digest="$(docker image inspect "${REDIS_IMAGE}" --format '{{.Id}}')"
          app_archive_sha256="$(sha256sum "${RELEASE_ROOT}/images/${app_archive}.gz" | cut -d' ' -f1)"
          redis_archive_sha256="$(sha256sum "${RELEASE_ROOT}/images/${redis_archive}.gz" | cut -d' ' -f1)"
          config_toml_sha256="$(find config -maxdepth 1 -type f \( -name '*.toml' -o -name '*.toml.example' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          frontend_static_sha256="$(find static -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"

          cp deploy/deploy.sh "${RELEASE_ROOT}/deploy.sh"
          cp deploy/smoke.sh "${RELEASE_ROOT}/smoke.sh"
          cp deploy/smoke.targets "${RELEASE_ROOT}/smoke.targets"
          cp deploy/compose.release.yml "${RELEASE_ROOT}/compose.yaml"
          sed "s/__RELEASE_TAG__/${GIT_TAG}/g" deploy/release.env.example > "${RELEASE_ROOT}/.env.example"
          sed "s/__RELEASE_TAG__/${GIT_TAG}/g" deploy/README.release.md > "${RELEASE_ROOT}/README.md"
          touch "${RELEASE_ROOT}/secrets/.gitkeep"
          cat > "${RELEASE_ROOT}/release-manifest.json" <<EOF
          {
            "manifest_version": "release-manifest/v1",
            "git_tag": "${GIT_TAG}",
            "git_sha": "${git_sha}",
            "app_image_ref": "${IMAGE_NAME}:${GIT_TAG}",
            "app_image_digest": "${app_image_digest}",
            "app_archive_sha256": "${app_archive_sha256}",
            "redis_image_ref": "${REDIS_IMAGE}",
            "redis_image_digest": "${redis_image_digest}",
            "redis_archive_sha256": "${redis_archive_sha256}",
            "frontend_static_sha256": "${frontend_static_sha256}",
            "config_toml_sha256": "${config_toml_sha256}",
            "artifact_created_at": "${created_at}"
          }
          EOF

          tar -czf "${package_name}" "${RELEASE_ROOT}"

          echo "PACKAGE_NAME=${package_name}" >> "${GITHUB_ENV}"
          echo "APP_ARCHIVE=${app_archive}.gz" >> "${GITHUB_ENV}"
          echo "REDIS_ARCHIVE=${redis_archive}.gz" >> "${GITHUB_ENV}"
          echo "GIT_SHA=${git_sha}" >> "${GITHUB_ENV}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: electricity-monitor-release-${{ inputs.git_tag }}
          path: ${{ env.PACKAGE_NAME }}
          retention-days: 30
          compression-level: 0

      - name: Build summary
        shell: bash
        env:
          GIT_TAG: ${{ inputs.git_tag }}
        run: |
          {
            echo "## Release package created"
            echo
            echo "- Git tag: \`${GIT_TAG}\`"
            echo "- Target platform: \`linux/amd64\`"
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- App image archive: \`${APP_ARCHIVE}\`"
            echo "- Redis image archive: \`${REDIS_ARCHIVE}\`"
            echo "- Git SHA: \`${GIT_SHA}\`"
            echo "- Manifest: \`release/release-manifest.json\`"
            echo
            echo "### Deploy steps"
            echo "1. Download artifact \`electricity-monitor-release-${GIT_TAG}\`"
            echo "2. Upload \`${PACKAGE_NAME}\` to the server"
            echo "3. Extract it and run \`chmod +x deploy.sh && ./deploy.sh\`"
          } >> "${GITHUB_STEP_SUMMARY}"
